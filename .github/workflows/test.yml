name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies with the system Perl
        env:
          PERL_CARTON_MIRROR: https://cpan.metacpan.org
        run: |
          sudo apt-get update
          sudo apt-get install -y perl carton build-essential util-linux
          /usr/bin/carton install --deployment
      - name: Run tests
        run: /usr/bin/carton exec /usr/bin/prove -lr t
      - name: Check Perl formatting
        run: |
          for source_file in cpanfile script/outcrop script/outcrop-web lib/Outcrop.pm lib/Outcrop/*.pm t/*.t; do
            /usr/bin/carton exec perltidy --assert-tidy -st "$source_file" > /dev/null
          done
      - name: Verify disk discovery and the kernel sequence ioctl
        run: |
          image=$(mktemp)
          device=
          trap 'if [ -n "$device" ]; then sudo losetup --detach "$device"; fi; rm -f "$image"' EXIT
          truncate -s 8M "$image"
          device=$(sudo losetup --find --show "$image")
          sudo env OUTCROP_TEST_BLOCK_DEVICE="$device" /usr/bin/carton exec /usr/bin/prove -lv t/disk-linux.t
