name: CPAN distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7 # v1.44.2
        with:
          perl-version: '5.38'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config build-essential
          cpanm --notest --installdeps .
      - name: Test CPAN distribution
        run: |
          perl Makefile.PL
          make test
          make dist
          test -f App-Outcrop-0.001.tar.gz
          perl -Iblib/lib -MApp::Outcrop -e 'my $root = App::Outcrop::resource_root(); die "Missing packaged assets" unless -f "$root/templates/index.html.ep" && -f "$root/public/outcrop.js"'
